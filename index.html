:root{--bg:#f3f5fa;--card:#fff;--ink:#14202e;--mut:#5d6b7c;--pri:#005fa8;--onp:#fff;--line:#dbe1ea;--bad:#c62828;--badbg:#fdecea;--chip:#e6eef8;--ok:#1b7a3d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1620;--card:#18222f;--ink:#e8eef5;--mut:#98a6b6;--pri:#4d9de0;--onp:#06121e;--line:#2a3646;--bad:#ff8a80;--badbg:#3a1f1f;--chip:#22334a;--ok:#6fd195}}
:root[data-theme="dark"]{--bg:#0f1620;--card:#18222f;--ink:#e8eef5;--mut:#98a6b6;--pri:#4d9de0;--onp:#06121e;--line:#2a3646;--bad:#ff8a80;--badbg:#3a1f1f;--chip:#22334a;--ok:#6fd195}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,system-ui,sans-serif;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pri);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pri);color:var(--onp);display:flex;align-items:center;gap:8px;padding:12px 14px;z-index:9}
header h1{font-size:19px;margin:0;flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.ib{background:none;border:0;color:inherit;font-size:20px;padding:4px 8px}
main{padding:12px;max-width:720px;margin:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:right}
.mc b{display:block;font-size:18px}.mc span{color:var(--mut);font-size:13px}
.bad{color:var(--bad)!important;font-weight:700}
.mc.cur{background:var(--pri);color:var(--onp);border-color:var(--pri)}
.mc.cur span{color:var(--onp);opacity:.9}
.mc.cur .bad{color:#ffd0cc!important}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.day.today{border-color:var(--pri);border-width:2px}
.day{scroll-margin-top:72px}
.dh{display:flex;justify-content:space-between;padding:9px 12px;background:var(--chip);font-weight:700}
.dh small{font-weight:400;color:var(--mut)}
.r{display:flex;align-items:center;gap:8px;padding:7px 12px;border-top:1px solid var(--line)}
.r label{width:98px;color:var(--mut);font-size:13px;flex:none}
.r button{flex:1;text-align:right;min-height:34px;background:none;border:1px dashed var(--line);border-radius:8px;padding:4px 8px}
.nm{display:inline-block;background:var(--chip);color:var(--ink);border:1px solid var(--pri);border-radius:12px;padding:1px 10px;margin:2px 0 2px 4px;font-size:14px}
.r button.f{border-style:solid;background:var(--chip)}
.idle{background:rgba(224,138,0,.18);border-right:4px solid #e08a00;padding:7px 12px;font-size:13px}
.inf{background:rgba(0,95,168,.14);color:var(--pri);padding:7px 12px;font-size:13px;border-top:1px solid var(--line)}
.cf{background:var(--badbg);color:var(--bad);padding:7px 12px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar button,.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.btn.p{background:var(--pri);color:var(--onp);border-color:var(--pri)}
#sh{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}
#sh.on{display:flex}
.pn{background:var(--card);width:100%;max-height:82vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));max-width:720px;margin:auto}
.pn h2{margin:0 0 10px;font-size:17px}
.ch{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ch button{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:7px 14px}
.ch button.s{background:var(--pri);color:var(--onp);border-color:var(--pri)}
.ch button.dis{opacity:.4;pointer-events:none;text-decoration:line-through}
.ch button.ms{background:#c62828;color:#fff;border-color:#c62828}
.ch button.wo{border-style:dashed;opacity:.75;text-decoration:line-through}
.nm.u1,.ch button.u1{text-decoration:line-through}
.nm.u2,.ch button.u2{text-decoration:line-through;text-decoration-style:double}
.nm.cl{background:#e08a00;color:#1a1a1a}
.nm.mx{background:#c62828;color:#fff}
.nm.of{background:var(--chip);color:var(--mut);border:1px dashed var(--mut);text-decoration:line-through}
.ch button.s2{background:#1b7a6d;color:#fff;border-color:#1b7a6d}
.nm.nt{color:var(--bad);font-weight:700}
.ch button.mg{background:#1b8a3a;color:#fff;border-color:#1b8a3a}
.nm.nt.cl{color:#7a0000}
.day.lk .r button:not(.kb),.day.lk .r input{pointer-events:none;opacity:.6}
.ch button.nt{background:var(--chip);color:var(--bad);font-weight:700}
.dl{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.dl.on{border:2px solid var(--pri)}
.dl b{display:block;margin-bottom:6px}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;text-align:center}
td,th{border:1px solid var(--line);padding:5px 6px;white-space:nowrap}th{background:var(--chip)}
input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;z-index:30;display:none}
#pr{display:none}
@media print{body>*:not(#pr){display:none!important}#pr{display:block}body::before{display:none}table{font-size:9px}}
</style>
</head>

<script>
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const SL=[{k:'cam1',l:'كاميرا 1',p:'m'},{k:'cam2',l:'كاميرا 2',p:'m'},{k:'cam3',l:'كاميرا 3',p:'m'},{k:'cam4',l:'كاميرا 4',p:'m'},{k:'cam5',l:'كاميرا 5',p:'m'},{k:'sm',l:'ستوديو صباحي 9ص–5م',p:'m'},{k:'se',l:'ستوديو مسائي 5م–1ص',p:'e'},{k:'sn',l:'ستوديو مبيت 1ص–9ص (اليوم التالي)',p:'n'},{k:'inv1',l:'جرد معدات',p:'m'},{k:'inv2',l:'جرد عهدة',p:'m'},{k:'perm',l:'استخراج تصاريح',p:'m'},{k:'sb',l:'احتياطي stand by',p:'m'}];
const OT=['inv1','inv2','perm','sb'];
const LT={a:'سنوية',e:'طارئة',s:'مرضية',c:'بدل راحة',m:'مهمة خارجية'};
const CAMS=['cam1','cam2','cam3','cam4','cam5'],XC=['cam3','cam4','cam5'];
const KEY='shiftapp1';
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{staff:['مكي','عرسان','يحيى','حسام','حاتم','بيتر','محسن','وليد','جمال','علي'],data:{},allow:{a:21,e:6},y:2026};
const rawSave=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const save=()=>{if(window.SYNC&&window.SYNC.hook)window.SYNC.hook();else rawSave()};
const D7=[['بيتر محسن حسام','حاتم جمال عرسان وليد يحيى'],['مكي عرسان يحيى حسام','حاتم بيتر محسن وليد'],['مكي بيتر محسن وليد','حاتم عرسان علي حسام'],['حاتم جمال عرسان محسن وليد','مكي بيتر علي حسام'],['جمال بيتر علي حسام','مكي يحيى'],['جمال علي','مكي عرسان يحيى'],['حاتم وليد يحيى','جمال محسن علي']];
if(!S.tpl)S.tpl=D7.map(([m,e])=>({m:m.split(' '),e:e.split(' ')}));
const NM={'جمال':'مصور/ جمال الشيخ','حاتم':'مصور/ حاتم عبدالسلام','بيتر':'مصور/ بيتر وديع','مكي':'مصور/ احمد مكي','عرسان':'مصور/ عرسان رزق','محسن':'فني/ محسن عبد العاطي','حسام':'فني/ حسام صلاح','وليد':'فني/ وليد سيد','يحيى':'فني/ محمد يحيى','علي':'فني/ علي عبد العزيز'};
if(S.v!==2){const f=n=>NM[n]||n,fa=a=>(a||[]).map(f),fo=o=>Object.fromEntries(Object.entries(o||{}).map(([k,v])=>[f(k),v]));
 S.staff=Object.values(NM);S.tpl.forEach(t=>{t.m=fa(t.m);t.e=fa(t.e)});
 Object.values(S.data).forEach(mm=>Object.values(mm).forEach(x=>{['rm','re',...CAMS,'sm','se','sn','cl'].forEach(k=>{if(x[k])x[k]=fa(x[k])});if(x.mc)Object.keys(x.mc).forEach(k=>x.mc[k]=fa(x.mc[k]));['lv','gv','lr'].forEach(k=>{if(x[k])x[k]=fo(x[k])})}));
 S.v=2;save()}
let mo=null,SH=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const blank=()=>({rm:[],re:[],cam1:[],cam2:[],cam3:[],cam4:[],cam5:[],sm:[],se:[],sn:[],inv1:[],inv2:[],perm:[],sb:[],lv:{},cl:[],gv:{},ct:{},lr:{},ot:{},mi:{cam1:[],cam2:[],cam3:[],cam4:[],cam5:[]},gi:{},mc:{cam1:[],cam2:[],cam3:[],cam4:[],cam5:[]},note:''});
const key=m=>S.y+'-'+m;
const dim=m=>new Date(S.y,m,0).getDate();
const dgY=(y,m,d)=>{const o=Object.assign(blank(),(S.data[y+'-'+m]||{})[d]||{});SL.forEach(s=>{const v=o[s.k];if(!Array.isArray(v))o[s.k]=v?[v]:[]});['mi','mc'].forEach(q=>{o[q]=Object.assign(Object.fromEntries(CAMS.map(c=>[c,[]])),o[q]||{})});if(Object.values(o.lv||{}).includes('m'))o.lv=Object.fromEntries(Object.entries(o.lv).filter(([q,t])=>t!=='m'));return o};
const dg=(m,d)=>dgY(S.y,m,d);
const nxt=(m,d)=>{const t=new Date(S.y,m-1,d+1);return dgY(t.getFullYear(),t.getMonth()+1,t.getDate())};
function dsY(y,m,d,x){const k=y+'-'+m;S.data[k]=S.data[k]||{};S.data[k][d]=x;save()}
const ds=(m,d,x)=>dsY(S.y,m,d,x);
function toast(t){const e=$('ts');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}

function conf(x,nx,wd){
 const r=new Set(),as=[];
 x.rm.forEach(n=>as.push([n,'الصباحي']));x.re.forEach(n=>as.push([n,'المسائي']));
 SL.forEach(s=>{if(s.k!=='sn')x[s.k].forEach(n=>as.push([n,s.l]))});
 as.forEach(([n,l])=>{if(x.lv[n])r.add(n+' ('+LT[x.lv[n]]+') وعليه '+l)});
 x.rm.filter(n=>x.re.includes(n)).forEach(n=>r.add(n+' في الصباحي والمسائي معاً'));
 const mm=[...CAMS,'sm'].flatMap(k=>x[k]);
 mm.filter((n,i)=>mm.indexOf(n)!==i).forEach(n=>r.add(n+' مكرر في الفترة الصباحية'));
 x.se.filter(n=>x.sn.includes(n)).forEach(n=>r.add(n+' في المسائي والمبيت معاً'));
 if(nx){x.sn.forEach(n=>{if(!(nx.rm.length+nx.re.length))r.add(n+' عليه مبيت يبدأ 1ص من اليوم التالي، وروتة اليوم التالي غير مخططة');else if(!(nx.rm.includes(n)||nx.re.includes(n))&&!nx.cl.includes(n))r.add(n+' غير مخطط له في اليوم التالي (إجازة أسبوعية) وعليه مبيت يبدأ 1ص');if(nx.lv[n])r.add(n+' ('+LT[nx.lv[n]]+') في اليوم التالي وعليه مبيت يبدأ 1ص')})}
 CAMS.forEach(k=>x.mc[k].forEach(n=>{if([...CAMS,'sm','se'].some(q=>x[q].includes(n)))r.add(n+' في مهمة خارجية وعليه تشغيل في نفس اليوم')}));
 if(wd!==undefined&&S.tpl){const t=S.tpl[wd];if(t&&t.m.length+t.e.length)[...x.rm,...x.re,...x.cam1,...x.cam2,...x.cam3,...x.cam4,...x.cam5,...x.sm,...x.se].filter(n=>!t.m.includes(n)&&!t.e.includes(n)&&!x.cl.includes(n)).forEach(n=>r.add(n+' في إجازته الأسبوعية (يلزم استدعاء طارئ)'))}
 return [...r];
}
const monthConf=m=>{let c=0;for(let d=1;d<=dim(m);d++)c+=conf(dg(m,d),nxt(m,d),new Date(S.y,m-1,d).getDay()).length;return c};
const filled=m=>Object.keys(S.data[key(m)]||{}).length;

function home(){
 mo=null;
 $('hd').innerHTML=`<h1>يوميات التشغيل</h1><button class="ib" onclick="location.href='missions/index.html'" aria-label="دور المهمات">✈️</button><button class="ib" onclick="tplView()" aria-label="الروتة الأسبوعية">📋</button><button class="ib" onclick="staffSh()" aria-label="الموظفون">👥</button><button class="ib" onclick="setSh()" aria-label="الإعدادات">⚙️</button><button class="ib" onclick="yr(1)">‹</button><b>${S.y}</b><button class="ib" onclick="yr(-1)">›</button>`;
 let h='<div class="grid">';
 for(let m=1;m<=12;m++){const c=monthConf(m);h+=`<button class="mc${(S.y===new Date().getFullYear()&&m===new Date().getMonth()+1)?' cur':''}" onclick="openM(${m})"><b>شهر ${MN[m-1]} (${m})</b><span>${filled(m)} يوم مسجل</span>${(S.y===new Date().getFullYear()&&m===new Date().getMonth()+1)?'<br><span>● الشهر الحالي</span>':''}${c?`<br><span class="bad">${c} تعارض</span>`:''}</button>`}
 $('mn').innerHTML=h+'</div>';
}
function yr(n){S.y+=n;save();home()}

function openM(m){
 try{if(!(history.state&&history.state.v==='m'))history.pushState({v:'m'},'')}catch(e){}
 mo=m;
 $('hd').innerHTML=`<button class="ib" onclick="home()" aria-label="رجوع">→</button><h1>يوميات تشغيل شهر ${MN[m-1]} (${m})</h1><button class="ib" onclick="location.href='missions/index.html'" aria-label="دور المهمات">✈️</button>`;
 const t=new Date();let h=`<div class="bar"><button class="btn p" onclick="genM()">توليد تلقائي</button><button onclick="sum()">الملخص</button><button onclick="tplView()">الروتة الأسبوعية</button><button onclick="tplApplySh()">تطبيق الروتة على الشهر</button><button onclick="exp()">تصدير</button></div>`;
 for(let d=1;d<=dim(m);d++){
  const x=dg(m,d),dt=new Date(S.y,m-1,d),c=conf(x,nxt(m,d),dt.getDay());
  const tod=dt.toDateString()===t.toDateString();

function ntSend(d){const dt=new Date(S.y,mo-1,d),sy=window.SYNC,by=sy&&sy.on?(sy.name||sy.user||''):'';
 const msg='تم اعتماد تشغيل يوم '+WD[dt.getDay()]+' '+d+'/'+mo+'/'+S.y+(by?' — '+by:'');
 $('pn').innerHTML=`<h2>🔔 إشعار الزملاء</h2><p style="margin:0 0 8px;font-size:13px;color:var(--mut)">سيصل هذا الإشعار لكل من يستخدم التطبيق، مع رنة. يمكنك تعديل النص.</p><textarea id="ntT" style="width:100%;height:90px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:10px">${esc(msg)}</textarea><div class="bar"><button class="btn p" onclick="ntDo(${d})">إرسال الإشعار</button><button class="btn" onclick="closeSh()">إلغاء</button></div>`;$('sh').classList.add('on')}
async function ntDo(d){const sy=window.SYNC,msg=($('ntT').value||'').trim();if(!msg){toast('اكتب نص الإشعار');return}
 const n={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),msg,y:S.y,m:mo,d,by:sy&&sy.on?(sy.name||sy.user||''):'أنت',uid:SESS?SESS.uid:'',at:new Date().toISOString()};
 if(sy&&sy.on){if(sy.ro){toast('للاطلاع فقط');return}
  try{const r=await api('/rest/v1/kv?on_conflict=key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify([{key:'nt:'+n.id,value:n,updated_at:n.at,updated_by:SESS.uid}])});if(!r.ok)throw 0;
   NTL.unshift(Object.assign({sent:1},n));ntSave();closeSh();toast('تم إرسال الإشعار للزملاء')}catch(e){toast('تعذر الإرسال — تأكد من الاتصال')}}
 else{NTL.unshift(Object.assign({sent:1},n));ntSave();closeSh();toast('نسخة تجريبية: لا يوجد زملاء متصلون، وهذه معاينة للإشعار');setTimeout(()=>ntShow(n,1),900)}}
let ntBusy=false;
async function ntPull(){if(ntBusy||!(window.SYNC&&SYNC.on)||!SESS)return;ntBusy=true;
 try{const r=await api('/rest/v1/kv?select=key,value,updated_at&key=like.nt:*&updated_at=gt.'+encodeURIComponent(NTA)+'&order=updated_at.asc');if(r.ok){const rows=await r.json();let last=null;
  for(const w of rows){if(w.updated_at>NTA)NTA=w.updated_at;const n=w.value||{};if(n.uid===SESS.uid||NTL.some(z=>z.id===n.id))continue;NTL.unshift(n);last=n}
  ntSave();if(last)ntShow(last)}}catch(e){}ntBusy=false}
setInterval(ntPull,20000);setTimeout(ntPull,4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)ntPull()});
function ntList(){$('pn').innerHTML='<h2>🔔 سجل الإشعارات</h2>'+(NTL.length?NTL.map(n=>`<div style="border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px"><div style="font-size:12px;color:var(--mut)">${n.sent?'أرسلته أنت':'من '+esc(n.by||'زميل')} · ${ntWhen(n)}</div><div>${esc(n.msg)}</div><button class="btn" style="margin-top:6px" onclick="ntGo(${n.y},${n.m},${n.d})">عرض اليوم</button></div>`).join(''):'<p style="color:var(--mut)">لا توجد إشعارات بعد.</p>')+'<div class="bar"><button class="btn" onclick="setSh()">رجوع</button></div>';$('sh').classList.add('on')}
async function ntPerm(){try{const r=await Notification.requestPermission();toast(r==='granted'?'تم تفعيل إشعارات الموبايل':'لم يتم السماح بالإشعارات من المتصفح')}catch(e){toast('الإشعارات غير مدعومة هنا')}setSh()}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(SESS)afterLogin();else showLogin();

</script>
</body>
</html>
