/* الدور: من لم يسافر منذ ضبط الدور أولًا بترتيب الضبط، ثم الأقدم سفرًا فالأحدث */
function queue(g,ty,ex){
 const b=S.cfg.base[g+'-'+ty]||{order:[],date:'0',at:'0'},last={};
 for(const t of live()){if(t.id===ex||t.nq||t.type!==ty||t.date<b.date||t.created<=b.at)continue;
  const k=t.date+'|'+t.created;for(const id of t[g]||[])if(!last[id]||k>last[id])last[id]=k}
 const bi=id=>{const i=b.order.indexOf(id);return i<0?999:i};
 return S.cfg.people[g].filter(x=>!x.off).sort((a,c)=>{const la=last[a.id]||'',lc=last[c.id]||'';return la!==lc?(la<lc?-1:1):bi(a.id)-bi(c.id)})}
function lastTrip(g,ty,id){let d='';for(const t of live())if(t.type===ty&&(t[g]||[]).includes(id)&&t.date>d)d=t.date;return d}

 for(const g of['p','t']){const q=queue(g,F.type);const a=q.find(x=>!avail(g,x.id,F.date,F.type==='night'?F.ret:''));const pick=a||q[0];if(pick)F[g].add(pick.id);
  for(const x of q){if(x===pick)break;why.push(x.n+': '+avail(g,x.id,F.date,F.type==='night'?F.ret:''))}}
 if(why.length){F.why='إجازة';F.whyTxt=why.join('، ')}}
function drawForm(){
 const r=ro(),govs=placesFor(F.type);
 const grp=g=>{const q=queue(g,F.type,F.id);const sel=q.filter(x=>F[g].has(x.id));let skip=[];if(sel.length){const lastI=q.indexOf(sel[sel.length-1]);skip=q.slice(0,lastI).filter(x=>!F[g].has(x.id))}
  return`<div class="fld"><label>${GP[g]} <span style="font-size:12px">(بترتيب الدور، اختر واحدًا أو أكثر${g==='t'?' أو لا أحد':''})</span></label><div class="seg">${q.map((x,i)=>`<button class="chip ${F[g].has(x.id)?'on':''} ${i===0?'turn':''}" data-pk="${g}:${esc(x.id)}" ${r?'disabled':''}>${esc(x.n)}${i===0?'<small>الدور</small>':''}${(()=>{const a=avail(g,x.id,F.date,F.type==='night'?F.ret:'');return a?`<small class="av">${esc(a)}</small>`:''})()}</button>`).join('')}</div>
  </div>`};
 const sk=skipsOf(),skN=[...sk.p.map(id=>pName('p',id)),...sk.t.map(id=>pName('t',id))];
 const skBox=skN.length?`<div class="warn"><div>تجاوز الدور: <b>${skN.map(esc).join('، ')}</b> — ${skN.length>1?'يحتفظون':'يحتفظ'} بالدور للمرة القادمة.</div><div style="margin:8px 0 6px">سبب التجاوز:</div><div class="seg">${WHY.map(w=>`<button class="chip ${F.why===w?'on':''}" data-why="${w}">${w}</button>`).join('')}</div>${F.why?`<input type="text" id="fwt" value="${esc(F.whyTxt||'')}" placeholder="${F.why==='سبب آخر'?'اكتب السبب':'تفاصيل (اختياري)'}" style="margin-top:8px">`:''}</div>`
  :(F.id&&skipText(S.trips[F.id]||{})?`<div class="warn">${esc(skipText(S.trips[F.id]))}</div>`:'');
 $('pn').innerHTML=`<h3>${F.id?(r?'تفاصيل المهمة':'تعديل المهمة'):'تسجيل مهمة'}<button class="x" id="cls" aria-label="إغلاق">×</button></h3>
 <div class="fld"><label>نوع المهمة</label><div class="seg">${TYPES.map(([k,n])=>`<button data-ty="${k}" class="${F.type===k?'on':''}" ${r?'disabled':''}>${n}<small style="display:block;font-size:11px;opacity:.75">${TS[k]}</small></button>`).join('')}</div></div>
 <div class="${F.type==='night'?'two':''}"><div class="fld"><label>تاريخ السفر</label><input type="date" id="fd" value="${F.date}" ${r?'disabled':''}></div>
 ${F.type==='night'?`<div class="fld"><label>تاريخ العودة</label><input type="date" id="fr" value="${F.ret}" ${r?'disabled':''}></div>`:''}</div>
 ${F.type==='night'?`<p class="note" style="margin-top:-8px">عدد الأيام: <b>${F.ret>=F.date?num(days(F.date,F.ret)):'—'}</b></p>`:''}
 <div class="fld"><label>المكان</label><input type="text" id="fg" list="fgl" value="${esc(F.gov)}" placeholder="اكتب أو اختر" ${r?'disabled':''}><datalist id="fgl">${govs.map(g=>`<option value="${esc(g)}">`).join('')}</datalist></div>
 ${grp('p')}${grp('t')}${skBox}
 <label class="ck"><input type="checkbox" id="fq" ${F.nq?'checked':''} ${r?'disabled':''}><span>مهمة خارج الدور<small>لا تحرّك الدور، مثل المهام الجماعية الكبيرة</small></span></label>
 <div class="fld"><label>المهمة / ملاحظة (اختياري)</label><input type="text" id="fn" value="${esc(F.note)}" ${r?'disabled':''}></div>
 ${r?'':`<div class="acts"><button class="btn p" id="fs">${F.id?'حفظ التعديل':'تسجيل المهمة'}</button>${F.id?'<button class="btn d" id="fx">حذف</button>':''}</div>`}${F.id?'<div class="acts"><button class="btn" id="fcp" style="flex:1">نسخ نص المهمة لإرساله</button></div>':''}`}
function closeSh(){$('sh').classList.remove('on');F=null}
function submit(){
 if(!F.p.size&&!F.t.size){toast('اختر شخصًا واحدًا على الأقل');return}
 if(!F.date){toast('حدد تاريخ السفر');return}
 if(!F.gov){toast('اكتب المكان');return}
 const sk=skipsOf(),hasSk=sk.p.length||sk.t.length;
 if(hasSk&&!F.why){toast('اختر سبب تجاوز الدور');return}
 if(hasSk&&F.why==='سبب آخر'&&!(F.whyTxt||'').trim()){toast('اكتب سبب التجاوز');return}
 if(F.type==='night'&&!(F.ret>F.date)){toast('تاريخ العودة يجب أن يكون بعد تاريخ السفر');return}
 const old=F.id&&S.trips[F.id];
 const t={id:F.id||uid(),type:F.type,date:F.date,ret:F.type==='night'?F.ret:'',gov:F.gov,note:F.note.trim(),nq:!!F.nq,...(old?{skip:old.skip,why:old.why,whyTxt:old.whyTxt}:hasSk?{skip:sk,why:F.why,whyTxt:(F.whyTxt||'').trim()}:{}),p:[...F.p],t:[...F.t],created:old?old.created:new Date().toISOString(),upd:new Date().toISOString(),by:SYNC.user||''};
 if(old&&old.type===t.type&&old.date===t.date)t.created=old.created;
 S.trips[t.id]=t;save();render();
 if(old){closeSh();toast('تم حفظ التعديل');return}
 F=null;$('pn').innerHTML=`<h3>تم تسجيل المهمة<button class="x" id="cls" aria-label="إغلاق">×</button></h3><pre class="tx">${esc(tripText(t))}</pre><div class="acts"><button class="btn p" data-cp="${esc(t.id)}">نسخ النص لإرساله</button><button class="btn" id="cls2">تم</button></div>`}
function confirmBox(msg,yes){$('pn').innerHTML=`<h3>تأكيد</h3><p>${msg}</p><div class="acts"><button class="btn p" id="cy">نعم</button><button class="btn" id="cn">إلغاء</button></div>`;$('cy').onclick=yes;$('cn').onclick=()=>{F&&F.id?drawForm():closeSh()};$('sh').classList.add('on')}

/* ===== الأحداث ===== */
document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-ed],[data-per]');if(!b)return;const d=b.dataset;
 if(e.target.closest('#sh')&&!e.target.closest('.pn'))return;
 if(d.cpk){const[k,v]=d.cpk.split(':');CP[k]=k==='full'?v==='true':v;drawCopy();return}
 if(d.cpt){openCopy(d.cpt);return}
 if(d.cp){copy(tripText(S.trips[d.cp]));return}
 if(d.ed){openForm(d.ed);return}
 if(d.per&&tab==='archive'){AF.per=d.per;render();return}
 if(d.mn){const dd=new Date(AF.mon+'-15T12:00');dd.setMonth(dd.getMonth()+Number(d.mn));AF.mon=iso(dd).slice(0,7);render();return}
 if(d.af){const[k,v]=d.af.split(':');AF[k]=v;if(k==='g')AF.per='';render();return}
 if(d.ty&&F){if(F.type!==d.ty&&!F.id)F.gov=d.ty==='in'?'العاصمة':'';F.type=d.ty;if(!F.id)preselect();drawForm();return}
 if(d.why&&F){F.why=F.why===d.why?'':d.why;drawForm();return}
 if(d.pk&&F){const[g,id]=d.pk.split(':');F[g].has(id)?F[g].delete(id):F[g].add(id);drawForm();return}
 if(d.mv){const[i,s]=d.mv.split(':').map(Number);const o=QE.o;[o[i],o[i+s]]=[o[i+s],o[i]];render();return}
 if(d.off){const[g,id]=d.off.split(':');const p=S.cfg.people[g].find(x=>x.id===id);p.off=!p.off;QE=null;save();render();return}
 if(d.add){const g=d.add,inp=$('add-'+g),n=inp.value.trim();if(!n)return;const id=g+uid();S.cfg.people[g].push({id,n});for(const[ty]of TYPES){const bb=S.cfg.base[g+'-'+ty];if(bb)bb.order.push(id)}QE=null;save();render();toast('تمت الإضافة في آخر الدور');return}
 switch(b.id){
  case'fab':openForm();break;
  case'cls':case'cls2':closeSh();break;
  case'fcp':copy(tripText(S.trips[F.id]));break;
  case'rcp':openCopy();break;
  case'rcp2':copy(rosterText());break;
  case'fs':submit();break;
  case'fx':confirmBox('حذف هذه المهمة؟ سيُعاد حساب الدور تلقائيًا.',()=>{const t=S.trips[F.id];t.del=true;t.upd=new Date().toISOString();save();closeSh();render();toast('تم الحذف')});break;
  case'qsv':{const[g,ty]=QS.split('-');const before=queue(g,ty).map(x=>x.id);if(before.join()===QE.o.join()){toast('لم يتغير الترتيب');break}
   const lid=uid();(S.logs=S.logs||{})[lid]={id:lid,qk:QS,before,after:QE.o.slice(),by:SYNC.name||SYNC.user||'',at:new Date().toISOString()};
   S.cfg.base[QS]={order:QE.o.slice(),date:today(),at:new Date().toISOString()};QE=null;save();render();toast('تم حفظ ترتيب '+GP[g]+' — '+TN[ty]);break}
  case'cpy':navigator.clipboard.writeText(tsv('\t')).then(()=>toast('تم النسخ'),()=>toast('تعذر النسخ'));break;
  case'dl':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+tsv(',')],{type:'text/csv'}));a.download='سفريات-'+GP[AF.g]+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000);break}
  case'rst':confirmBox('إرجاع البيانات كما جاءت من Table Notes؟ ستُحذف أي مهام جرّبتها.',()=>{S=realState();rawSave();closeSh();QE=null;render()});break;
  case'syN':SYNC.now();break;
  case'lgm':LOGN+=10;render();break;
  case'upd':checkUpd(1);break;
  case'out':confirmBox('تسجيل الخروج؟ سيخرجك من «المهمات» و«اليوميات» معًا على هذا الجهاز.',()=>{try{['yw_sess','mm_uid','mm_role','mm_dy',KEY].forEach(k=>localStorage.removeItem(k))}catch(x){}location.reload()});break;
 }});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(F&&t.id==='fd'){F.date=t.value;if(F.ret<=F.date)F.ret=addD(F.date,1);if(!F.id)preselect();drawForm()}
 else if(F&&t.id==='fr'){F.ret=t.value;if(!F.id)preselect();drawForm()}
 else if(F&&t.id==='fg')F.gov=t.value.trim();
 else if(F&&t.id==='fq'){F.nq=t.checked;drawForm()}
 else if(t.id==='afPer'){AF.per=t.value;render()}
 else if(t.id==='afMon'){AF.mon=t.value;render()}
 else if(t.id==='qs'){QS=t.value;QE=null;render()}
 else if(d.rn){const[g,id]=d.rn.split(':'),n=t.value.trim();if(n){S.cfg.people[g].find(x=>x.id===id).n=n;save();toast('تم تعديل الاسم')}}});
document.addEventListener('input',e=>{if(F&&e.target.id==='fn')F.note=e.target.value;if(F&&e.target.id==='fwt')F.whyTxt=e.target.value;if(F&&e.target.id==='fg')F.gov=e.target.value.trim()});
$('sh').addEventListener('click',e=>{if(e.target.id==='sh')closeSh()});
function route(){const h=location.hash.slice(1);tab=['roster','archive','settings'].includes(h)?h:'roster';if(F)closeSh();render();scrollTo(0,0)}
addEventListener('hashchange',route);

/* ===== المزامنة مع Supabase (نفس جدول kv ونفس حسابات يوميات التشغيل، مفاتيح تبدأ بـ tr:) ===== */
const SYNC={on:false,user:'',name:'',role:'viewer',ro:true,stat:'idle',
 label(){return this.stat==='ok'?'متصل ومحفوظ':this.stat==='pend'?'جارٍ الحفظ…':this.stat==='err'?'غير متصل (سيُحفظ لاحقًا)':'—'},
 now(){pull(true).then(()=>push())}};
let SESS=null;try{SESS=JSON.parse(localStorage.getItem('yw_sess'))}catch(e){}
const SNAP={};let pushT=null,pushing=false,again=false,PULLAT='1970-01-01T00:00:00Z';
const sk=o=>Array.isArray(o)?o.map(sk):(o&&typeof o==='object')?Object.keys(o).sort().reduce((r,k)=>(r[k]=sk(o[k]),r),{}):o;
const st=o=>JSON.stringify(sk(o));
function curKeys(){const o={'tr:cfg':st(S.cfg)};for(const id in S.trips)o['tr:t:'+id]=st(S.trips[id]);for(const id in S.logs||{})o['tr:log:'+id]=st(S.logs[id]);return o}
function setStat(s){SYNC.stat=s;$('syb').textContent=!SYNC.on?'تجربة':SYNC.ro&&s!=='err'?'اطلاع فقط':s==='ok'?'● محفوظ':s==='pend'?'⟳ جارٍ الحفظ':s==='err'?'⚠ غير متصل':'';const e=$('syS');if(e)e.textContent=SYNC.label()}
function rerender(){if($('sh').classList.contains('on'))return;const y=scrollY;render();scrollTo(0,y)}
async function raw(path,opt={},tok){const h=Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},opt.headers||{});if(tok)h.Authorization='Bearer '+tok;return fetch(SB_URL+path,Object.assign({},opt,{headers:h}))}
function storeSess(j){SESS={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+(j.expires_in||3600),uid:j.user.id,email:j.user.email};try{localStorage.setItem('yw_sess',JSON.stringify(SESS))}catch(e){}}
async function refreshTok(){if(!SESS)return false;
 try{const o=JSON.parse(localStorage.getItem('yw_sess'));if(o&&o.uid===SESS.uid&&o.expires_at>SESS.expires_at&&o.expires_at-Date.now()/1000>90){SESS=o;return true}}catch(e){}
 try{const r=await raw('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:SESS.refresh_token})});if(!r.ok){if([400,401,403].includes(r.status)){SESS=null;try{localStorage.removeItem('yw_sess')}catch(e){}showLogin('انتهت الجلسة، سجّل الدخول من جديد')}return false}storeSess(await r.json());return true}catch(e){return false}}
async function api(path,opt){if(!SESS)throw 0;if(SESS.expires_at-Date.now()/1000<90)await refreshTok();if(!SESS)throw 0;let r=await raw(path,opt,SESS.access_token);if(r.status===401&&await refreshTok())r=await raw(path,opt,SESS.access_token);return r}
function schedulePush(){if(SYNC.ro)return;clearTimeout(pushT);setStat('pend');pushT=setTimeout(push,1000)}
async function push(){if(!SYNC.on||SYNC.ro||!SESS)return;if(pushing){again=true;return}pushing=true;
 try{const cur=curKeys(),rows=[];for(const k in cur)if(SNAP[k]!==cur[k])rows.push({key:k,value:JSON.parse(cur[k]),updated_at:new Date().toISOString(),updated_by:SESS.uid});
  if(rows.length){const r=await api('/rest/v1/kv?on_conflict=key',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});if(!r.ok)throw 0;rows.forEach(x=>SNAP[x.key]=cur[x.key])}
  setStat('ok')}catch(e){setStat('err')}
 pushing=false;if(again){again=false;schedulePush()}}
async function pull(full){if(!SYNC.on||!SESS)return false;
 try{const since=full?'1970-01-01T00:00:00Z':PULLAT;const r=await api('/rest/v1/kv?select=key,value,updated_at&key=like.tr:*&updated_at=gt.'+encodeURIComponent(since)+'&order=updated_at.asc');if(!r.ok)throw 0;
  const rows=await r.json();let ch=false;const cur=curKeys();
  for(const w of rows){const sv=st(w.value),k=w.key;if(w.updated_at>PULLAT)PULLAT=w.updated_at;
   if(cur[k]!==undefined&&SNAP[k]!==undefined&&cur[k]!==SNAP[k])continue;
   if(cur[k]===sv){SNAP[k]=sv;continue}
   if(k==='tr:cfg')S.cfg=w.value;else if(k.startsWith('tr:t:'))S.trips[k.slice(5)]=w.value;else if(k.startsWith('tr:log:'))(S.logs=S.logs||{})[k.slice(7)]=w.value;else continue;
   SNAP[k]=sv;ch=true}
  if(ch){rawSave();QE=null;rerender()}
  if(SYNC.stat!=='pend')setStat('ok');return true}catch(e){setStat('err');return false}}
async function loadProfile(){try{const r=await api('/rest/v1/profiles?id=eq.'+SESS.uid+'&select=role,name');if(r.ok){const p=(await r.json())[0]||{};SYNC.role=p.role||'viewer';SYNC.name=p.name||'';try{localStorage.setItem('mm_role',JSON.stringify([SYNC.role,SYNC.name]))}catch(e){}return}}catch(e){}
 try{const c=JSON.parse(localStorage.getItem('mm_role'));if(c){SYNC.role=c[0];SYNC.name=c[1]}}catch(e){}}
async function afterLogin(){
 const lu=localStorage.getItem('mm_uid');
 if(lu&&lu!==SESS.uid){try{localStorage.removeItem(KEY)}catch(e){}S={cfg:null,trips:{}}}
 try{localStorage.setItem('mm_uid',SESS.uid)}catch(e){}
 hideLogin();SYNC.on=true;SYNC.user=SESS.email.replace(DOM,'');
 await loadProfile();SYNC.ro=!(SYNC.role==='owner'||SYNC.role==='editor');
 setStat('pend');const ok=await pull(true);pullDY(!DY.cfg);
 if(!S.cfg){if(!ok){showLogin('تعذر تحميل البيانات، تأكد من الاتصال وحاول مرة أخرى');return}S=realState();rawSave()}
 if(!SYNC.ro)schedulePush();else setStat('ok');
 setInterval(()=>{pull(false);pullDY(false)},20000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){pull(false);push()}});
 addEventListener('online',()=>{pull(false);push()});
 route();checkUpd(0)}
function showLogin(msg){const d=$('lg');d.style.display='flex';
 d.innerHTML=`<div class="card"><h1 style="margin:0 0 4px;font-size:24px;text-align:center">دور المهمات</h1><p class="note" style="text-align:center;margin-bottom:16px">ادخل بنفس حساب «يوميات التشغيل»</p>
 <input type="text" id="lgU" autocomplete="username" placeholder="اسم المستخدم" dir="ltr" style="margin-bottom:10px"><input type="password" id="lgP" autocomplete="current-password" placeholder="كلمة المرور" dir="ltr" style="width:100%;min-height:44px;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--pan);margin-bottom:10px">
 <div id="lgE" style="color:var(--acc);font-size:14px;min-height:22px">${esc(msg||'')}</div><button class="btn p" id="lgB" style="width:100%">دخول</button></div>`;
 $('lgB').onclick=doLogin;$('lgP').onkeydown=e=>{if(e.key==='Enter')doLogin()}}
function hideLogin(){$('lg').style.display='none'}
async function doLogin(){const u=$('lgU').value.trim(),p=$('lgP').value;if(!u||!p){$('lgE').textContent='اكتب اسم المستخدم وكلمة المرور';return}
 $('lgB').disabled=true;$('lgE').textContent='';
 try{const r=await raw('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:u.includes('@')?u:u+DOM,password:p})});const j=await r.json();
  if(!r.ok){$('lgE').textContent=r.status===400?'اسم المستخدم أو كلمة المرور غير صحيحة':(j.msg||'تعذر الدخول');$('lgB').disabled=false;return}
  storeSess(j);await afterLogin()}catch(e){$('lgE').textContent='لا يوجد اتصال بالإنترنت';$('lgB').disabled=false}}
async function checkUpd(manual){if(!LIVE)return;try{const r=await fetch('version.json?'+Date.now(),{cache:'no-store'});const j=await r.json();
 if(j.v&&j.v!==APP_V){if(manual||confirmUpd()){location.reload()}}else if(manual)toast('أنت على أحدث إصدار')}catch(e){if(manual)toast('تعذر البحث عن تحديث')}}
function confirmUpd(){toast('يوجد تحديث جديد — جارٍ التحميل');setTimeout(()=>location.reload(),1500);return false}

/* ===== التشغيل ===== */
load();
const COMBO=/\/missions\//.test(location.pathname);if(COMBO)$('yb').hidden=false;
if(LIVE){
 if(S.cfg)route();
 if(SESS){hideLogin();afterLogin()}else showLogin();
}else{
 localDY();if(COMBO)$('demo').textContent='نسخة تجريبية مشتركة مع اليوميات: الإجازات والراحات تُقرأ من جدول اليوميات في هذه النسخة. كل البيانات على هذا الجهاز فقط.';
 if(!S.cfg||S.dv!==DV)S=realState();rawSave();$('demo').hidden=false;setStat('idle');route();
}
}
</script>
